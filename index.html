<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .player-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        .player-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .album-art {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-title {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .artist-name {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            font-weight: 500;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-slider {
            flex: 1;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border-radius: 50%;
        }

        .volume-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }

        audio {
            display: none;
        }

        .status {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <!-- Player 1: New Track 1 -->
    <div class="player-container">
        <div class="player-header">
            <div class="album-art">
                <img src="https://i.imgur.com/7RxKqZL.jpg" alt="Album Cover">
            </div>
            <h1 class="song-title">Track 1</h1>
            <p class="artist-name">Music</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar1">
                <div class="progress" id="progress1"></div>
            </div>
            <div class="time-display">
                <span id="currentTime1">0:00</span>
                <span id="duration1">0:00</span>
            </div>
        </div>

        <div class="volume-container">
            <label for="volumeSlider1" style="font-size: 14px; color: #666;">🔊</label>
            <input type="range" id="volumeSlider1" class="volume-slider" min="0" max="100" value="70">
        </div>

        <div class="status" id="status1"></div>
    </div>

    <!-- Player 2: New Track 2 -->
    <div class="player-container">
        <div class="player-header">
            <div class="album-art">
                <img src="https://i.imgur.com/7RxKqZL.jpg" alt="Album Cover">
            </div>
            <h1 class="song-title">Track 2</h1>
            <p class="artist-name">Music</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar2">
                <div class="progress" id="progress2"></div>
            </div>
            <div class="time-display">
                <span id="currentTime2">0:00</span>
                <span id="duration2">0:00</span>
            </div>
        </div>

        <div class="volume-container">
            <label for="volumeSlider2" style="font-size: 14px; color: #666;">🔊</label>
            <input type="range" id="volumeSlider2" class="volume-slider" min="0" max="100" value="70">
        </div>

        <div class="status" id="status2"></div>
    </div>

    <audio id="audioPlayer1"></audio>
    <audio id="audioPlayer2"></audio>

    <script>
        // Player 1
        const audioPlayer1 = document.getElementById('audioPlayer1');
        const progressBar1 = document.getElementById('progressBar1');
        const progress1 = document.getElementById('progress1');
        const currentTimeDisplay1 = document.getElementById('currentTime1');
        const durationDisplay1 = document.getElementById('duration1');
        const volumeSlider1 = document.getElementById('volumeSlider1');
        const statusDisplay1 = document.getElementById('status1');

        audioPlayer1.src = 'https://storage.kagujjemovies.com/stream/1445?hash=2327f8';

        audioPlayer1.addEventListener('timeupdate', () => {
            const percentage = (audioPlayer1.currentTime / audioPlayer1.duration) * 100;
            progress1.style.width = percentage + '%';
            currentTimeDisplay1.textContent = formatTime(audioPlayer1.currentTime);
        });

        audioPlayer1.addEventListener('loadedmetadata', () => {
            durationDisplay1.textContent = formatTime(audioPlayer1.duration);
        });

        progressBar1.addEventListener('click', (e) => {
            const rect = progressBar1.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer1.currentTime = percent * audioPlayer1.duration;
        });

        volumeSlider1.addEventListener('input', (e) => {
            audioPlayer1.volume = e.target.value / 100;
        });

        audioPlayer1.addEventListener('play', () => {
            statusDisplay1.textContent = '🎵 Now playing...';
        });

        audioPlayer1.addEventListener('pause', () => {
            statusDisplay1.textContent = '⏸ Paused';
        });

        audioPlayer1.addEventListener('ended', () => {
            statusDisplay1.textContent = '✓ Completed';
        });

        audioPlayer1.volume = 0.7;

        // Player 2
        const audioPlayer2 = document.getElementById('audioPlayer2');
        const progressBar2 = document.getElementById('progressBar2');
        const progress2 = document.getElementById('progress2');
        const currentTimeDisplay2 = document.getElementById('currentTime2');
        const durationDisplay2 = document.getElementById('duration2');
        const volumeSlider2 = document.getElementById('volumeSlider2');
        const statusDisplay2 = document.getElementById('status2');

        audioPlayer2.src = 'https://storage.kagujjemovies.com/stream/1441?hash=b107c4';

        audioPlayer2.addEventListener('timeupdate', () => {
            const percentage = (audioPlayer2.currentTime / audioPlayer2.duration) * 100;
            progress2.style.width = percentage + '%';
            currentTimeDisplay2.textContent = formatTime(audioPlayer2.currentTime);
        });

        audioPlayer2.addEventListener('loadedmetadata', () => {
            durationDisplay2.textContent = formatTime(audioPlayer2.duration);
        });

        progressBar2.addEventListener('click', (e) => {
            const rect = progressBar2.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audioPlayer2.currentTime = percent * audioPlayer2.duration;
        });

        volumeSlider2.addEventListener('input', (e) => {
            audioPlayer2.volume = e.target.value / 100;
        });

        audioPlayer2.addEventListener('play', () => {
            statusDisplay2.textContent = '🎵 Now playing...';
        });

        audioPlayer2.addEventListener('pause', () => {
            statusDisplay2.textContent = '⏸ Paused';
        });

        audioPlayer2.addEventListener('ended', () => {
            statusDisplay2.textContent = '✓ Completed';
        });

        audioPlayer2.volume = 0.7;

        // Format time helper function
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
